    <script type="text/babel">
      const { useState, useEffect, createContext, useContext, useRef } = React;

      // ==================== INITIAL DATA & TYPES ====================
      const bathroomRotationSequence = ['thiego', 'manuela', 'tayrone'];
      const generalRotationSequence = ['thiego', 'manuela', 'tayrone'];
      const daysOfWeek = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];

      const initialAppState = {
        children: {
          thiego: { key: 'thiego', name: 'Thiego', age: 14, xp: 100, passwordHash: null, avatar: '👦', color: 'bg-indigo-500', birthday: '2012-08-15' },
          manuela: { key: 'manuela', name: 'Manuela', age: 14, xp: 120, passwordHash: null, avatar: '👧', color: 'bg-rose-500', birthday: '2012-03-20' },
          tayrone: { key: 'tayrone', name: 'Tayrone', age: 9, xp: 80, passwordHash: null, avatar: '🧒', color: 'bg-amber-500', birthday: '2017-11-05' }
        },
        adminPassword: 'admin1234',
        rotations: { bathroomIndex: 0, dishIndex: 0, trashIndex: 0, dogIndex: 0 },
        isStoreOpen: true,
        isDayOff: false,
        tasks: [
          { id: 1, title: 'Arrumar a Cama', description: 'Dobrar o lençol, arrumar os travesseiros e deixar o quarto organizado.', xp: 10, penalty: 15, type: 'daily', assignedTo: 'all', schedule: 'Todos os dias', deadline: '12:00', needCheck: true, canTrade: false, category: 'daily', days: ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'] },
          { id: 2, title: 'Tirar o Lixo', description: 'Recolher o lixo da cozinha e dos banheiros e colocar na lixeira da rua.', xp: 15, penalty: 25, type: 'rotation', assignedTo: generalRotationSequence[0], schedule: 'Seg, Qua e Sex', deadline: '12:00', needCheck: true, canTrade: true, category: 'rotation', days: ['segunda', 'quarta', 'sexta'] },
          { id: 3, title: 'Água e Comida da Cachorra', description: 'Lavar os potes, abastecer com água fresca e servir a porção de ração.', xp: 15, penalty: 25, type: 'daily', assignedTo: generalRotationSequence[0], schedule: 'Todos os dias', deadline: '09:00', needCheck: true, canTrade: true, category: 'daily', days: ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'] },
          { id: 4, title: 'Limpar o Quarto', description: 'Varrer o chão, tirar o pó dos móveis e guardar todas as roupas e sapatos.', xp: 25, penalty: 40, type: 'weekly', assignedTo: 'all', schedule: 'Toda Quarta-feira', deadline: '18:00', needCheck: true, canTrade: false, category: 'rotation', days: ['quarta'] },
          { id: 5, title: 'Lavar Banheiro', description: 'Lavar o vaso, a pia, passar pano no chão e recolher o lixo.', xp: 50, penalty: 75, type: 'rotation', assignedTo: bathroomRotationSequence[0], schedule: 'Toda Quinta-feira', deadline: '17:00', needCheck: true, canTrade: true, category: 'rotation', days: ['quinta'] },
          { id: 6, title: 'Secar Louça da Janta', description: 'Secar pratos, talheres, copos e panelas e guardar nos armários.', xp: 20, penalty: 30, type: 'rotation', assignedTo: generalRotationSequence[0], schedule: 'Todos os dias', deadline: '21:00', needCheck: true, canTrade: true, category: 'daily', days: ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'] },
          { id: 7, title: '30 Minutos de Leitura', description: 'Ler um livro de sua escolha por no mínimo 30 minutos diários.', xp: 30, penalty: 0, type: 'flexible', assignedTo: 'all', schedule: '3x por semana (Livre escolha)', deadline: '21:00', needCheck: true, canTrade: false, category: 'flexible', days: ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'] }
        ],
        rewards: [
          { id: 101, title: '30 Minutos a mais de Videogame / Celular', description: 'Ganhe tempo extra de tela no final de semana.', cost: 50, icon: '🎮', available: true },
          { id: 102, title: 'Escolher o Filme da Sexta à Noite', description: 'Sua escolha de filme com direito a pipoca na sessão de cinema em família.', cost: 80, icon: '🍿', available: true },
          { id: 103, title: 'Escolher o Lanche do Fim de Semana', description: 'Decida o pedido do iFood ou jantar especial da família.', cost: 120, icon: '🍔', available: true },
          { id: 104, title: 'R$ 15,00 no PIX (Mesada Extra)', description: 'Transferência direta de R$ 15 para sua conta ou cofrinho.', cost: 200, icon: '💵', available: true }
        ],
        pendingApprovals: [],
        pendingRedemptions: [],
        appliedPenaltiesLog: [],
        suggestionsLog: [],
        historyLog: [
          { id: 'h-1', childKey: 'manuela', taskTitle: 'Arrumar a Cama', status: 'completed', xpChange: 10, timestamp: new Date(Date.now() - 3600000 * 5).toISOString() },
          { id: 'h-2', childKey: 'thiego', taskTitle: '30 Minutos de Leitura', status: 'completed', xpChange: 30, timestamp: new Date(Date.now() - 3600000 * 24).toISOString() }
        ],
        pendingSwaps: []
      };

      function getDaysUntilBirthday(birthdayStr) {
        if (!birthdayStr) return null;
        const parts = birthdayStr.split('-');
        if (parts.length < 3) return null;
        const month = parseInt(parts[1], 10) - 1;
        const day = parseInt(parts[2], 10);
        if (isNaN(month) || isNaN(day)) return null;

        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        let nextBirthday = new Date(now.getFullYear(), month, day);

        if (nextBirthday < today) {
          nextBirthday = new Date(now.getFullYear() + 1, month, day);
        }

        const diffTime = nextBirthday.getTime() - today.getTime();
        const days = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const formattedDate = `${day} de ${monthNames[month]}`;
        return { days, formattedDate };
      }

      const LEVEL_RANKS = [
        { level: 1, name: 'Iniciante Preguiçoso 😴', minXp: 0, maxXp: 30, color: 'text-zinc-600 bg-zinc-100 dark:bg-zinc-800' },
        { level: 2, name: 'Caçador de Meia Perdida 🧦', minXp: 30, maxXp: 70, color: 'text-blue-600 bg-blue-50 dark:bg-blue-900/40' },
        { level: 3, name: 'Dobrador de Lençol 🛏️', minXp: 70, maxXp: 120, color: 'text-sky-600 bg-sky-50 dark:bg-sky-900/40' },
        { level: 4, name: 'Mestre do Escorredor 🍽️', minXp: 120, maxXp: 200, color: 'text-teal-600 bg-teal-50 dark:bg-teal-900/40' },
        { level: 5, name: 'General da Vassoura 🧹', minXp: 200, maxXp: 350, color: 'text-indigo-600 bg-indigo-50 dark:bg-indigo-900/40' },
        { level: 6, name: 'Guardião do Sabão 🧼', minXp: 350, maxXp: 600, color: 'text-purple-600 bg-purple-50 dark:bg-purple-900/40' },
        { level: 7, name: 'Soberano da Louça 👑', minXp: 600, maxXp: 1000, color: 'text-fuchsia-600 bg-fuchsia-50 dark:bg-fuchsia-900/40' },
        { level: 8, name: 'Lorde do Pano de Chão 🧽', minXp: 1000, maxXp: 1600, color: 'text-rose-600 bg-rose-50 dark:bg-rose-900/40' },
        { level: 9, name: 'Destruidor da Sujeira ⚡', minXp: 1600, maxXp: 2500, color: 'text-amber-600 bg-amber-50 dark:bg-amber-900/40' },
        { level: 10, name: 'Lenda Suprema do Lar 🏆', minXp: 2500, maxXp: 4000, color: 'text-emerald-600 bg-emerald-50 dark:bg-emerald-900/40' }
      ];

      function getRankForXp(xp) {
        for (let i = LEVEL_RANKS.length - 1; i >= 0; i--) {
          if (xp >= LEVEL_RANKS[i].minXp) {
            const current = LEVEL_RANKS[i];
            const next = LEVEL_RANKS[i + 1];
            if (!next) {
              const extraLevel = current.level + Math.floor((xp - current.minXp) / 2000);
              return { level: extraLevel, title: `Super Lenda nível ${extraLevel} 🌟`, name: `Super Lenda nível ${extraLevel} 🌟`, progress: 100, nextXp: 'Max', color: current.color };
            }
            const range = next.minXp - current.minXp;
            const gained = xp - current.minXp;
            const pct = Math.min(100, Math.max(0, Math.round((gained / range) * 100)));
            return { level: current.level, title: current.name, name: current.name, progress: pct, nextXp: next.minXp, color: current.color };
          }
        }
        return { level: 1, title: LEVEL_RANKS[0].name, name: LEVEL_RANKS[0].name, progress: 0, nextXp: 30, color: LEVEL_RANKS[0].color };
      }

      // ==================== APP CONTEXT ====================
      const STORAGE_KEY = 'qg_familia_app_state_v1';
      const CURRENT_USER_KEY = 'qg_familia_current_user_v1';
      const AppContext = createContext();

      function AppProvider({ children }) {
        const [state, setState] = useState(() => {
          try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) return { ...initialAppState, ...JSON.parse(saved) };
          } catch (e) {}
          return initialAppState;
        });

        const [currentUser, setCurrentUser] = useState(() => {
          try { return localStorage.getItem(CURRENT_USER_KEY) || null; } catch { return null; }
        });

        const [activeTab, setActiveTab] = useState('tasks');
        const [confettiActive, setConfettiActive] = useState(false);

        useEffect(() => {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (err) {}
        }, [state]);

        useEffect(() => {
          if (currentUser) localStorage.setItem(CURRENT_USER_KEY, currentUser);
          else localStorage.removeItem(CURRENT_USER_KEY);
        }, [currentUser]);

        const triggerConfetti = () => {
          setConfettiActive(true);
          setTimeout(() => setConfettiActive(false), 3200);
        };

        const checkFirstAccess = (userKey) => {
          if (userKey === 'admin') return false;
          const child = state.children[userKey];
          return child ? child.passwordHash === null : false;
        };

        const login = (userKey, passwordInput) => {
          if (!passwordInput || !passwordInput.trim()) return { success: false, message: 'Por favor, digite a senha!' };
          if (userKey === 'admin') {
            if (passwordInput === state.adminPassword) {
              setCurrentUser('admin');
              setActiveTab('admin');
              return { success: true };
            }
            return { success: false, message: 'Senha incorreta para o Supervisor (Pai)!' };
          }
          const child = state.children[userKey];
          if (!child) return { success: false, message: 'Usuário não encontrado!' };
          if (child.passwordHash === null) {
            setState(prev => ({
              ...prev,
              children: { ...prev.children, [userKey]: { ...prev.children[userKey], passwordHash: passwordInput } }
            }));
            setCurrentUser(userKey);
            setActiveTab('tasks');
            return { success: true, message: 'Senha cadastrada com sucesso!' };
          }
          if (child.passwordHash === passwordInput) {
            setCurrentUser(userKey);
            setActiveTab('tasks');
            return { success: true };
          }
          return { success: false, message: 'Senha incorreta!' };
        };

        const logout = () => {
          setCurrentUser(null);
          setActiveTab('tasks');
        };

        const completeTask = (taskId, note) => {
          if (!currentUser || currentUser === 'admin') return { success: false, message: 'Ação não permitida.' };
          if (state.isDayOff) return { success: false, message: 'Hoje é Dia de Folga! 🌴 Tarefas pausadas.' };

          const task = state.tasks.find(t => t.id === taskId);
          if (!task) return { success: false, message: 'Tarefa não encontrada.' };

          if (task.needCheck) {
            const alreadyPending = state.pendingApprovals.some(p => p.taskId === taskId && p.childKey === currentUser);
            if (alreadyPending) return { success: false, message: 'Já está aguardando aprovação do Pai!' };
            const newApproval = { id: 'appr-' + Date.now(), taskId: task.id, childKey: currentUser, title: task.title, xp: task.xp, requestedAt: new Date().toISOString(), note };
            setState(prev => ({ ...prev, pendingApprovals: [newApproval, ...prev.pendingApprovals] }));
            return { success: true, pending: true, message: 'Enviado para a validação do Pai!' };
          }

          let updatedRotations = { ...state.rotations };
          let updatedTasks = [...state.tasks];
          if (task.id === 5) {
            updatedRotations.bathroomIndex = (updatedRotations.bathroomIndex + 1) % bathroomRotationSequence.length;
            updatedTasks = updatedTasks.map(t => t.id === 5 ? { ...t, assignedTo: bathroomRotationSequence[updatedRotations.bathroomIndex] } : t);
          } else if (task.id === 6) {
            updatedRotations.dishIndex = (updatedRotations.dishIndex + 1) % generalRotationSequence.length;
            updatedTasks = updatedTasks.map(t => t.id === 6 ? { ...t, assignedTo: generalRotationSequence[updatedRotations.dishIndex] } : t);
          } else if (task.id === 2) {
            updatedRotations.trashIndex = (updatedRotations.trashIndex + 1) % generalRotationSequence.length;
            updatedTasks = updatedTasks.map(t => t.id === 2 ? { ...t, assignedTo: generalRotationSequence[updatedRotations.trashIndex] } : t);
          } else if (task.id === 3) {
            updatedRotations.dogIndex = (updatedRotations.dogIndex + 1) % generalRotationSequence.length;
            updatedTasks = updatedTasks.map(t => t.id === 3 ? { ...t, assignedTo: generalRotationSequence[updatedRotations.dogIndex] } : t);
          }

          const newHistory = { id: 'h-' + Date.now(), childKey: currentUser, taskTitle: task.title, status: 'completed', xpChange: task.xp, timestamp: new Date().toISOString() };
          setState(prev => ({
            ...prev, rotations: updatedRotations, tasks: updatedTasks,
            children: { ...prev.children, [currentUser]: { ...prev.children[currentUser], xp: prev.children[currentUser].xp + task.xp } },
            historyLog: [newHistory, ...prev.historyLog]
          }));
          triggerConfetti();
          return { success: true, pending: false, xpGained: task.xp, message: `Excelente! Você ganhou +${task.xp} XP!` };
        };

        const applyPenalty = (taskId) => {
          if (!currentUser || currentUser === 'admin') return { success: false, message: 'Ação inválida.', penaltyApplied: 0 };
          if (state.isDayOff) return { success: false, message: 'Hoje é Dia de Folga! Nenhuma penalidade.', penaltyApplied: 0 };
          const task = state.tasks.find(t => t.id === taskId);
          if (!task) return { success: false, message: 'Tarefa não encontrada.', penaltyApplied: 0 };
          const child = state.children[currentUser];

          const newPenaltyLog = { id: 'pen-' + Date.now(), childKey: currentUser, taskId: task.id, title: task.title, penalty: task.penalty, appliedAt: new Date().toISOString() };
          const newHistory = { id: 'h-' + Date.now(), childKey: currentUser, taskTitle: task.title, status: 'expired', xpChange: -task.penalty, timestamp: new Date().toISOString() };
          const newXp = Math.max(0, child.xp - task.penalty);

          setState(prev => ({
            ...prev,
            children: { ...prev.children, [currentUser]: { ...prev.children[currentUser], xp: newXp } },
            appliedPenaltiesLog: [newPenaltyLog, ...(prev.appliedPenaltiesLog || [])],
            historyLog: [newHistory, ...prev.historyLog]
          }));
          return { success: true, penaltyApplied: task.penalty, message: `Prazo expirou! Descontados ${task.penalty} XP. Peça aos Pais para reverterem se houver justificativa!` };
        };

        const createTaskSwap = (fromTaskId, toChildKey, toTaskId) => {
          if (!currentUser || currentUser === 'admin') return { success: false, message: 'Selecione um perfil de criança.' };
          if (state.isDayOff) return { success: false, message: 'Trocas desativadas no Dia de Folga.' };
          const newSwap = { id: 'swap-' + Date.now(), fromChildKey: currentUser, toChildKey, fromTaskId, toTaskId, status: 'pending', requestedAt: new Date().toISOString() };
          setState(prev => ({ ...prev, pendingSwaps: [newSwap, ...(prev.pendingSwaps || [])] }));
          return { success: true, message: `Proposta de troca enviada! O irmão precisa aceitar no painel dele.` };
        };

        const acceptTaskSwap = (swapId) => {
          const swap = (state.pendingSwaps || []).find(s => s.id === swapId);
          if (!swap) return;
          setState(prev => ({
            ...prev,
            tasks: prev.tasks.map(t => {
              if (t.id === swap.fromTaskId) return { ...t, assignedTo: swap.toChildKey };
              if (t.id === swap.toTaskId) return { ...t, assignedTo: swap.fromChildKey };
              return t;
            }),
            pendingSwaps: (prev.pendingSwaps || []).filter(s => s.id !== swapId)
          }));
        };

        const rejectTaskSwap = (swapId) => {
          setState(prev => ({ ...prev, pendingSwaps: (prev.pendingSwaps || []).filter(s => s.id !== swapId) }));
        };

        const requestRedemption = (rewardId) => {
          if (!currentUser || currentUser === 'admin') return { success: false, message: 'Selecione um perfil de criança.' };
          const reward = state.rewards.find(r => r.id === rewardId);
          if (!reward) return { success: false, message: 'Prêmio não encontrado.' };
          const child = state.children[currentUser];
          if (child.xp < reward.cost) return { success: false, message: `Saldo insuficiente! Precisa de ${reward.cost} XP (Seu saldo: ${child.xp} XP).` };

          const newRedemption = { id: 'red-' + Date.now(), rewardId: reward.id, childKey: currentUser, title: reward.title, cost: reward.cost, requestedAt: new Date().toISOString(), approved: false };
          setState(prev => ({ ...prev, pendingRedemptions: [newRedemption, ...prev.pendingRedemptions] }));
          triggerConfetti();
          return { success: true, message: `Pedido de resgate enviado para Os Pais!` };
        };

        const approveTask = (approvalId) => {
          const approval = state.pendingApprovals.find(p => p.id === approvalId);
          if (!approval) return;
          const childKey = approval.childKey;
          const newHistory = { id: 'h-' + Date.now(), childKey, taskTitle: approval.title, status: 'completed', xpChange: approval.xp, timestamp: new Date().toISOString() };
          setState(prev => ({
            ...prev,
            children: { ...prev.children, [childKey]: { ...prev.children[childKey], xp: (prev.children[childKey]?.xp || 0) + approval.xp } },
            pendingApprovals: prev.pendingApprovals.filter(p => p.id !== approvalId),
            historyLog: [newHistory, ...prev.historyLog]
          }));
        };

        const rejectTask = (approvalId) => {
          setState(prev => ({ ...prev, pendingApprovals: prev.pendingApprovals.filter(p => p.id !== approvalId) }));
        };

        const reversePenalty = (penaltyLogId) => {
          const penaltyItem = (state.appliedPenaltiesLog || []).find(p => p.id === penaltyLogId);
          if (!penaltyItem) return;
          const childKey = penaltyItem.childKey;
          const newHistory = { id: 'h-' + Date.now(), childKey, taskTitle: `Penalidade Revertida: ${penaltyItem.title}`, status: 'forgiven', xpChange: penaltyItem.penalty, timestamp: new Date().toISOString() };
          setState(prev => ({
            ...prev,
            children: { ...prev.children, [childKey]: { ...prev.children[childKey], xp: (prev.children[childKey]?.xp || 0) + penaltyItem.penalty } },
            appliedPenaltiesLog: (prev.appliedPenaltiesLog || []).filter(p => p.id !== penaltyLogId),
            historyLog: [newHistory, ...prev.historyLog]
          }));
        };

        const approveRedemption = (redemptionId) => {
          const redemption = state.pendingRedemptions.find(r => r.id === redemptionId);
          if (!redemption) return;
          const childKey = redemption.childKey;
          const newHistory = { id: 'h-' + Date.now(), childKey, taskTitle: `Resgate Aprovado (XP Zerado): ${redemption.title}`, status: 'reward_redeemed', xpChange: 0, timestamp: new Date().toISOString() };
          setState(prev => ({
            ...prev,
            children: { ...prev.children, [childKey]: { ...prev.children[childKey], xp: 0 } },
            pendingRedemptions: prev.pendingRedemptions.filter(r => r.id !== redemptionId),
            historyLog: [newHistory, ...prev.historyLog]
          }));
        };

        const rejectRedemption = (redemptionId) => {
          setState(prev => ({ ...prev, pendingRedemptions: prev.pendingRedemptions.filter(r => r.id !== redemptionId) }));
        };

        const addSuggestion = (text) => {
          if (!text || !text.trim()) return;
          let authorName = currentUser === 'admin' ? 'Os Pais' : (currentUser && state.children[currentUser] ? state.children[currentUser].name : 'Anônimo');
          const newSuggestion = { id: 'sug-' + Date.now(), author: authorName, text: text.trim(), date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
          setState(prev => ({ ...prev, suggestionsLog: [newSuggestion, ...(prev.suggestionsLog || [])] }));
        };

        const addTask = (newTaskData) => {
          const nextId = Math.max(0, ...state.tasks.map(t => t.id)) + 1;
          setState(prev => ({ ...prev, tasks: [...prev.tasks, { ...newTaskData, id: nextId }] }));
        };

        const updateTask = (updatedTask) => {
          setState(prev => ({ ...prev, tasks: prev.tasks.map(t => t.id === updatedTask.id ? updatedTask : t) }));
        };

        const deleteTask = (taskId) => {
          setState(prev => ({ ...prev, tasks: prev.tasks.filter(t => t.id !== taskId) }));
        };

        const addReward = (newRewardData) => {
          const nextId = Math.max(100, ...state.rewards.map(r => r.id)) + 1;
          setState(prev => ({ ...prev, rewards: [...prev.rewards, { ...newRewardData, id: nextId }] }));
        };

        const updateReward = (updatedReward) => {
          setState(prev => ({ ...prev, rewards: prev.rewards.map(r => r.id === updatedReward.id ? updatedReward : r) }));
        };

        const deleteReward = (rewardId) => {
          setState(prev => ({ ...prev, rewards: prev.rewards.filter(r => r.id !== rewardId) }));
        };

        const toggleStoreStatus = () => {
          setState(prev => ({ ...prev, isStoreOpen: !prev.isStoreOpen }));
        };

        const toggleDayOff = () => {
          setState(prev => ({ ...prev, isDayOff: !prev.isDayOff }));
        };

        const addChild = (childData) => {
          const key = childData.name.toLowerCase().trim().replace(/\s+/g, '_');
          if (state.children[key]) return;
          const newChild = { ...childData, key, xp: 0, passwordHash: null };
          setState(prev => ({ ...prev, children: { ...prev.children, [key]: newChild } }));
        };

        const updateChild = (childKey, data) => {
          if (!state.children[childKey]) return;
          setState(prev => ({ ...prev, children: { ...prev.children, [childKey]: { ...prev.children[childKey], ...data } } }));
        };

        const adjustXp = (childKey, delta, reason) => {
          const child = state.children[childKey];
          if (!child) return;
          const newXp = Math.max(0, child.xp + delta);
          const newHistory = { id: 'h-' + Date.now(), childKey, taskTitle: `Ajuste Pai: ${reason}`, status: delta >= 0 ? 'bonus' : 'expired', xpChange: delta, timestamp: new Date().toISOString() };
          setState(prev => ({
            ...prev,
            children: { ...prev.children, [childKey]: { ...prev.children[childKey], xp: newXp } },
            historyLog: [newHistory, ...prev.historyLog]
          }));
        };

        const resetChildPassword = (childKey) => {
          setState(prev => ({ ...prev, children: { ...prev.children, [childKey]: { ...prev.children[childKey], passwordHash: null } } }));
        };

        const resetWeekReport = () => {
          setState(prev => ({ ...prev, historyLog: [] }));

          setState(initialAppState);
          localStorage.removeItem(STORAGE_KEY);

        };

      // ==================== CONFETTI CANVAS COMPONENT ====================
      function Confetti({ active }) {
        const canvasRef = useRef(null);
        useEffect(() => {
          if (!active) return;
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;

          const particles = [];
          const colors = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#3b82f6'];
          for (let i = 0; i < 90; i++) {
            particles.push({
              x: canvas.width / 2 + (Math.random() - 0.5) * 300,
              y: canvas.height / 3 + (Math.random() - 0.5) * 100,
              size: Math.random() * 8 + 6,
              color: colors[Math.floor(Math.random() * colors.length)],
              vx: (Math.random() - 0.5) * 12,
              vy: Math.random() * -10 - 4,
              rotation: Math.random() * 360,
              vRot: (Math.random() - 0.5) * 10,
              opacity: 1
            });
          }

          let animId;
          let startTime = Date.now();
          const render = () => {
            const elapsed = Date.now() - startTime;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
              p.x += p.vx;
              p.y += p.vy;
              p.vy += 0.25;
              p.rotation += p.vRot;
              if (elapsed > 1800) p.opacity -= 0.02;
              ctx.save();
              ctx.globalAlpha = Math.max(0, p.opacity);
              ctx.translate(p.x, p.y);
              ctx.rotate((p.rotation * Math.PI) / 180);
              ctx.fillStyle = p.color;
              ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
              ctx.restore();
            });
            if (elapsed < 3000) animId = requestAnimationFrame(render);
            else ctx.clearRect(0, 0, canvas.width, canvas.height);
          };
          render();
          return () => { if (animId) cancelAnimationFrame(animId); };
        }, [active]);

        if (!active) return null;
        return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-50" style={{ width: '100vw', height: '100vh' }} />;
      }

      function StoreView() {
        const { state, currentUser, requestRedemption } = useApp();

        if (!currentUser || currentUser === 'admin') return null;

        const child = state.children[currentUser];
        const isStoreOpen = state.isStoreOpen;

        const handleRedeem = (reward) => {
          const res = requestRedemption(reward.id);
          if (res.message) {
            setStoreAlert({ type: res.success ? 'success' : 'error', message: res.message });
            setTimeout(() => setStoreAlert(null), 4000);
          }
        };

        return (
          <div className="space-y-4 max-w-4xl mx-auto py-2">
            {storeAlert && (
              <div className={`p-4 rounded-2xl border text-sm font-semibold ${storeAlert.type === 'success' ? 'bg-emerald-50 text-emerald-900' : 'bg-rose-50 text-rose-900'}`}>

            )}

            {!isStoreOpen ? (
              <div className="p-6 rounded-2xl bg-amber-50 border-2 border-dashed border-amber-400 text-amber-900 text-center space-y-2">
                <div className="text-3xl">🔒</div>
                <h3 className="text-lg font-black">Loja Será Aberta Em Breve!</h3>
                <p className="text-xs text-amber-800 max-w-lg mx-auto">Continue cumprindo suas missões e acumulando XP!</p>

                <p className="text-xs text-purple-100">Você possui <strong className="text-amber-300 text-sm">{child.xp} XP</strong> disponíveis.</p>

            <div className="bg-white dark:bg-zinc-900 p-5 rounded-2xl border border-zinc-200 dark:border-zinc-800 space-y-4">

                <h3 className="font-bold text-base text-zinc-900 dark:text-white">🛒 Lojinha de Prêmios</h3>
                <span className="text-xs font-bold text-zinc-500">Seu saldo: <strong className="text-indigo-600">{child.xp} XP</strong></span>

                {state.rewards.map(reward => {

                    <div key={reward.id} className="p-4 rounded-2xl border flex flex-col justify-between space-y-3 bg-white dark:bg-zinc-900">

                        <h4 className="font-bold text-sm mt-2">{reward.title}</h4>
                        {reward.description && <p className="text-xs text-zinc-500 mt-1">{reward.description}</p>}

                      <div className="pt-2 border-t">

                          <button disabled className="w-full py-2.5 rounded-xl bg-zinc-200 text-zinc-500 text-xs font-bold">🔒 Bloqueado</button>

                    </select>
                    <input type="number" value={xpDelta} onChange={(e) => setXpDelta(Number(e.target.value))} className="p-2.5 rounded-xl border text-xs font-bold" />
                    <input type="text" value={xpReason} onChange={(e) => setXpReason(e.target.value)} placeholder="Motivo" className="p-2.5 rounded-xl border text-xs" />
                  </div>
                  <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Aplicar Ajuste</button>
                </form>

                <div className="pt-4 border-t space-y-3">
                  <h4 className="font-bold text-sm">🎂 Datas de Aniversário & Senhas</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    {childrenList.map(c => (
                      <div key={c.key} className="p-4 border rounded-2xl space-y-2">
                        <div className="flex justify-between items-center">
                          <span className="font-bold text-xs">{c.avatar} {c.name}</span>
                          <button onClick={() => { resetChildPassword(c.key); alert(`Senha de ${c.name} redefinida!`); }} className="text-[10px] px-2 py-1 border rounded">Reset Senha</button>
                        </div>
                        <div>
                          <label className="block text-[10px] font-bold text-zinc-500">🎂 Data Aniversário:</label>
                          <input
                            type="date"
                            value={c.birthday || ''}
                            onChange={(e) => updateChild(c.key, { birthday: e.target.value })}
                            className="w-full p-2 border rounded-xl text-xs font-bold"
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="pt-4 border-t space-y-3">
                  <h4 className="font-bold text-sm">➕ Adicionar Novo Filho</h4>
                  <form onSubmit={handleCreateChild} className="p-4 border rounded-2xl space-y-3">
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                      <input type="text" value={newChildName} onChange={e => setNewChildName(e.target.value)} placeholder="Nome" className="p-2 border rounded-xl text-xs" required />
                      <input type="number" value={newChildAge} onChange={e => setNewChildAge(Number(e.target.value))} className="p-2 border rounded-xl text-xs" min={1} />
                      <input type="text" value={newChildAvatar} onChange={e => setNewChildAvatar(e.target.value)} className="p-2 border rounded-xl text-xs text-center" maxLength={4} />
                      <input type="date" value={newChildBirthday} onChange={e => setNewChildBirthday(e.target.value)} className="p-2 border rounded-xl text-xs font-bold" />
                    </div>
                    <button type="submit" className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Cadastrar Perfil</button>
                  </form>
                </div>

                <div className="pt-4 border-t border-rose-100 flex justify-between items-center p-3 bg-rose-50 rounded-2xl">
                  <div>
                    <span className="text-xs font-bold text-rose-900 block">Restaurar Configurações Iniciais</span>
                    <span className="text-[11px] text-rose-700">Reseta todas as missões e dados para o padrão inicial.</span>
                  </div>
                  <button onClick={() => { if (confirm('Restaurar padrão inicial?')) resetFactoryData(); }} className="px-3 py-2 bg-rose-600 text-white rounded-xl text-xs font-bold">Restaurar</button>
                </div>
              </div>
            )}
          </div>
        );
      }

      // ==================== SUGGESTION MODAL ====================
      function SuggestionModal() {
        const { addSuggestion } = useApp();
        const [isOpen, setIsOpen] = useState(false);
        const [text, setText] = useState('');
        const [sentSuccess, setSentSuccess] = useState(false);

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!text.trim()) return;
          addSuggestion(text);
          setText('');
          setSentSuccess(true);
          setTimeout(() => { setSentSuccess(false); setIsOpen(false); }, 2000);
        };

        return (
          <>
            <footer className="text-center py-4 mt-6">
              <button onClick={() => setIsOpen(true)} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border bg-white text-zinc-600 text-xs font-semibold shadow-xs">
                💡 <span>Mandar uma Sugestão</span>
              </button>
            </footer>

            {isOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60">
                <div className="w-full max-w-md bg-white dark:bg-zinc-900 rounded-2xl p-6 border shadow-xl space-y-4 relative">
                  <button onClick={() => setIsOpen(false)} className="absolute top-4 right-4 text-zinc-400">✕</button>
                  <h3 className="font-bold text-base">💡 Mandar uma Sugestão</h3>
                  {sentSuccess ? (
                    <p className="text-xs text-emerald-600 font-bold text-center py-4">Sugestão enviada para Os Pais!</p>
                  ) : (
                    <form onSubmit={handleSubmit} className="space-y-3">
                      <textarea
                        required
                        rows={4}
                        value={text}
                        onChange={e => setText(e.target.value)}
                        placeholder="Digite sua ideia..."
                        className="w-full p-3 rounded-xl border text-xs"
                      />
                      <div className="flex justify-end gap-2">
                        <button type="button" onClick={() => setIsOpen(false)} className="px-4 py-2 text-xs font-bold text-zinc-600">Cancelar</button>
                        <button type="submit" className="px-4 py-2 bg-amber-500 text-white text-xs font-bold rounded-xl">Enviar</button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}
          </>
        );
      }

      // ==================== MAIN APP CONTENT ====================
      function MainAppContent() {
        const { currentUser, activeTab, confettiActive } = useApp();
        return (
          <div className="min-h-screen bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-sans pb-12">
            <Confetti active={confettiActive} />
            <Navbar />
            <main className="px-4 py-4">
              {!currentUser ? (
                <LoginModal />
              ) : currentUser === 'admin' ? (
                <AdminView />
              ) : activeTab === 'tasks' ? (
                <TasksView />
              ) : (
                <StoreView />
              )}
            </main>
            <SuggestionModal />
          </div>
        );
      }

      function App() {
        return (
          <AppProvider>
            <MainAppContent />
          </AppProvider>
        );
      }

      // Render React App
      const rootElement = document.getElementById('root');
      ReactDOM.createRoot(rootElement).render(<App />);
    </script>
  </body>
</html>
